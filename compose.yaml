services:
  secret-init:
    image: alpine:3.22
    restart: "no"
    command:
      - /bin/sh
      - -ec
      - |
        umask 077
        if [ ! -s /root-secrets/mongo-root-password ]; then
          head -c 32 /dev/urandom | base64 | tr -d '\n' > /root-secrets/mongo-root-password
        fi
        if [ ! -s /app-secrets/mongo-app-password ]; then
          head -c 32 /dev/urandom | base64 | tr -d '\n' > /app-secrets/mongo-app-password
        fi
        chmod 0444 /root-secrets/mongo-root-password /app-secrets/mongo-app-password
    volumes:
      - forge-root-secret:/root-secrets
      - forge-app-secret:/app-secrets

  mongodb:
    image: mongo:8.0
    restart: unless-stopped
    depends_on:
      secret-init:
        condition: service_completed_successfully
    environment:
      MONGO_INITDB_ROOT_USERNAME: forge_root
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/forge-root-secret/mongo-root-password
    volumes:
      - mongo-data:/data/db
      - forge-root-secret:/run/forge-root-secret:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' mongodb://127.0.0.1:27017/test | grep 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  mongo-init:
    image: mongo:8.0
    restart: "no"
    depends_on:
      mongodb:
        condition: service_healthy
    command:
      - /bin/sh
      - -ec
      - |
        ROOT="$$(cat /run/forge-root-secret/mongo-root-password)"
        APP="$$(cat /run/forge-app-secret/mongo-app-password)"
        mongosh --quiet --host mongodb --username forge_root --password "$$ROOT" --authenticationDatabase admin --eval "db.getSiblingDB('admin').updateUser('forge_app',{pwd:'$$APP',roles:[{role:'readWrite',db:'forge'}]})" || \
        mongosh --quiet --host mongodb --username forge_root --password "$$ROOT" --authenticationDatabase admin --eval "db.getSiblingDB('admin').createUser({user:'forge_app',pwd:'$$APP',roles:[{role:'readWrite',db:'forge'}]})"
    volumes:
      - forge-root-secret:/run/forge-root-secret:ro
      - forge-app-secret:/run/forge-app-secret:ro

  forge:
    build:
      context: .
      dockerfile: Dockerfile
    image: forge-ide:0.1.0
    container_name: forge
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${IDE_PORT:-3000}:3000"
    environment:
      IDE_HOST: "0.0.0.0"
      IDE_AUTH_USER: "${IDE_AUTH_USER:-developer}"
      IDE_AUTH_PASSWORD: "${IDE_AUTH_PASSWORD:?Set IDE_AUTH_PASSWORD before starting Forge}"
      IDE_LOG_LEVEL: "${IDE_LOG_LEVEL:-INFO}"
      IDE_TERMINAL_ENABLED: "${IDE_TERMINAL_ENABLED:-true}"
      IDE_MAX_WORKSPACE_MB: "${IDE_MAX_WORKSPACE_MB:-2048}"
      IDE_MAX_STATE_MB: "${IDE_MAX_STATE_MB:-32}"
    volumes:
      - "${IDE_WORKSPACE:-./workspace}:/workspace"
      - forge-data:/data
      - forge-app-secret:/run/forge-app-secret:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: ${IDE_PIDS_LIMIT:-512}
    mem_limit: "${IDE_MEMORY_LIMIT:-4g}"
    cpus: "${IDE_CPU_LIMIT:-4.0}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      start_period: 25s
      retries: 10

volumes:
  forge-data:
  mongo-data:
  forge-root-secret:
  forge-app-secret:
