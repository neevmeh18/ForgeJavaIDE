# Forge local development stack.
#
# Single-user mode (default):
#   IDE_AUTH_PASSWORD='set-a-strong-password-at-least-12-chars' docker compose up --build
#
# Multiuser mode:
#   IDE_AUTH_USERS='alice:longPassword1,bob:differentPass2' docker compose up --build
#
# Both modes support the same isolation — each user gets their own session and their own
# workspace access, and events never cross users. The single-user env vars IDE_AUTH_USER and
# IDE_AUTH_PASSWORD are still supported for backward compatibility; when IDE_AUTH_USERS is set,
# it takes precedence.

services:
  forge:
    build:
      context: .
      dockerfile: Dockerfile
    image: forge-ide:0.1.0
    container_name: forge
    # Host-side loopback binding is deliberate. To expose Forge remotely, put an HTTPS reverse
    # proxy in front of it and change this mapping explicitly.
    ports:
      - "127.0.0.1:${IDE_PORT:-3000}:3000"
    environment:
      IDE_HOST: "0.0.0.0"
      IDE_AUTH_USER: "${IDE_AUTH_USER:-developer}"
      IDE_AUTH_PASSWORD: "${IDE_AUTH_PASSWORD:-}"
      IDE_AUTH_USERS: "${IDE_AUTH_USERS:-}"
      IDE_LOG_LEVEL: "${IDE_LOG_LEVEL:-INFO}"
      IDE_TERMINAL_ENABLED: "${IDE_TERMINAL_ENABLED:-true}"
      IDE_MAX_WORKSPACE_MB: "${IDE_MAX_WORKSPACE_MB:-2048}"
      IDE_MAX_STATE_MB: "${IDE_MAX_STATE_MB:-32}"
    volumes:
      - "${IDE_WORKSPACE:-./workspace}:/workspace"
      - forge-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: ${IDE_PIDS_LIMIT:-512}
    mem_limit: "${IDE_MEMORY_LIMIT:-4g}"
    cpus: "${IDE_CPU_LIMIT:-4.0}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      start_period: 25s
      retries: 10

volumes:
  forge-data:
